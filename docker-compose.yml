services:
  edgego-voice:
    build: .
    container_name: edgego-voice
    restart: unless-stopped
    ports:
      - "${PORT:-5050}:5050"
    environment:
      - PORT=5050
      - API_KEY=${API_KEY}
      - REQUIRE_API_KEY=${REQUIRE_API_KEY:-true}
      - DEFAULT_VOICE=${DEFAULT_VOICE:-pt-BR-ThalitaMultilingualNeural}
      - DEFAULT_RESPONSE_FORMAT=${DEFAULT_RESPONSE_FORMAT:-mp3}
      - DEFAULT_SPEED=${DEFAULT_SPEED:-1.0}
      - REMOVE_FILTER=${REMOVE_FILTER:-false}
      - DETAILED_ERROR_LOGGING=${DETAILED_ERROR_LOGGING:-true}
      - PROXY=${PROXY:-}
      - CACHE_ENABLED=${CACHE_ENABLED:-true}
      - CACHE_MAX_MB=${CACHE_MAX_MB:-50}
      - CACHE_TTL_HOURS=${CACHE_TTL_HOURS:-24}
    volumes:
      - ./voices.json:/app/voices.json:ro
      - ./personas.json:/app/personas.json
      - ./web:/app/web
